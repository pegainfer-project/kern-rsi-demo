license = "Apache-2.0"

[upstreams.kern]
revision = "90596d326b9b46094524d47c7f77c5eb0162f8f6"
path = "third_party/kern"
license = "Apache-2.0"

# One cubin per module. Dense Qwen3 has head_dim 128 at every size.
[modules]
qwen3 = "source/qwen3.cu"
elementwise = "source/elementwise.cu"
sampling = "source/sampling.cu"
sample_glue = "source/sample_glue.cu"
attention_plan = "source/attention_plan.cu"
attention = "source/attention.cu"
