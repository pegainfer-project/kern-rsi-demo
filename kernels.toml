# CUDA BF16 needs SM80 or later. Each architecture gets its own cubins and hashes.
architectures = ["sm_80", "sm_86", "sm_89", "sm_90", "sm_100", "sm_103", "sm_120", "sm_121"]

[upstreams.flashinfer]
revision = "d84335d8c54e0c8f9f7e22faa15c7e34a58abf94"
